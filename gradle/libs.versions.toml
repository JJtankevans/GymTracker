[versions]
# Kotlin & Build
kotlin                  = "2.3.10"
android-gradle-plugin   = "8.10.1"

# Navigation
androidx-navigation     = "2.9.0"

# Compose
compose-multiplatform   = "1.11.1"

# Supabase
material-icons-extended = "1.7.8"
supabase                = "3.6.0"

# Ktor
ktor                    = "3.5.1"

# Koin
koin                    = "4.1.0"

#Vico
vico                    = "3.2.3"

# Coroutines & Serialization
kotlinx-coroutines      = "1.11.0"
kotlinx-serialization   = "1.8.1"

# AndroidX
androidx-core-ktx            = "1.16.0"
androidx-activity-compose    = "1.10.1"
androidx-lifecycle           = "2.9.1"

# Compose BOM (Android)
compose-bom             = "2025.06.00"

# Test
junit                   = "4.13.2"
androidx-junit          = "1.2.1"
espresso-core           = "3.6.1"
kotlinx-datetime        = "0.6.1"
roborazzi               = "1.76.0"
robolectric             = "4.17"
wear-compose            = "1.5.0"
wear-core               = "1.3.0"
wear-ongoing            = "1.0.0"
health-services         = "1.0.0"
play-services-wearable  = "19.0.0"


[libraries]
# --- Compose Multiplatform (shared/commonMain) ---
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-icons-extended" }
compose-runtime              = { module = "org.jetbrains.compose.runtime:runtime",              version.ref = "compose-multiplatform" }
compose-foundation           = { module = "org.jetbrains.compose.foundation:foundation",        version.ref = "compose-multiplatform" }
compose-material3            = { module = "org.jetbrains.compose.material3:material3",          version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }

# --- Supabase BOM + módulos ---
supabase-bom            = { module = "io.github.jan-tennert.supabase:bom",           version.ref = "supabase" }
supabase-auth           = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest      = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-realtime       = { module = "io.github.jan-tennert.supabase:realtime-kt" }
supabase-storage        = { module = "io.github.jan-tennert.supabase:storage-kt" }

# --- Ktor engines ---
ktor-client-android     = { module = "io.ktor:ktor-client-android",  version.ref = "ktor" }
ktor-client-darwin      = { module = "io.ktor:ktor-client-darwin",   version.ref = "ktor" }
ktor-client-core        = { module = "io.ktor:ktor-client-core",     version.ref = "ktor" }

# --- Koin ---
koin-core               = { module = "io.insert-koin:koin-core",               version.ref = "koin" }
koin-android            = { module = "io.insert-koin:koin-android",            version.ref = "koin" }
koin-compose            = { module = "io.insert-koin:koin-compose",            version.ref = "koin" }
koin-compose-viewmodel  = { module = "io.insert-koin:koin-compose-viewmodel",  version.ref = "koin" }

# --- Coroutines ---
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# --- Serialization ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# --- Date/Time ---                        # NOVO BLOCO
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# --- Vico (gráficos) ---
vico-compose    = { module = "com.patrykandpatrick.vico:compose",    version.ref = "vico" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

# --- AndroidX ---
androidx-core-ktx            = { module = "androidx.core:core-ktx",                         version.ref = "androidx-core-ktx" }
androidx-activity-compose    = { module = "androidx.activity:activity-compose",              version.ref = "androidx-activity-compose" }
androidx-lifecycle-runtime   = { module = "androidx.lifecycle:lifecycle-runtime-ktx",        version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",  version.ref = "androidx-lifecycle" }
androidx-navigation-compose  = { module = "androidx.navigation:navigation-compose",          version.ref = "androidx-navigation" }

# --- Compose BOM (Android) ---
androidx-compose-bom                = { module = "androidx.compose:compose-bom",              version.ref = "compose-bom" }
androidx-compose-ui                 = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics        = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling         = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-manifest   = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-test-junit4     = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-material3          = { module = "androidx.compose.material3:material3" }

# --- Wear OS ---
wear-compose-material     = { module = "androidx.wear.compose:compose-material",    version.ref = "wear-compose" }
wear-compose-foundation   = { module = "androidx.wear.compose:compose-foundation",  version.ref = "wear-compose" }
wear-compose-navigation   = { module = "androidx.wear.compose:compose-navigation",  version.ref = "wear-compose" }
wear-core                 = { module = "androidx.wear:wear",                         version.ref = "wear-core" }
wear-ongoing              = { module = "androidx.wear:wear-ongoing",                 version.ref = "wear-ongoing" }
health-services-client    = { module = "androidx.health:health-services-client",    version.ref = "health-services" }
play-services-wearable    = { module = "com.google.android.gms:play-services-wearable", version.ref = "play-services-wearable" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

# --- Test ---
kotlin-test             = { module = "org.jetbrains.kotlin:kotlin-test",                  version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",     version.ref = "kotlinx-coroutines" }
roborazzi             = { module = "io.github.takahirom.roborazzi:roborazzi",         version.ref = "roborazzi" }
roborazzi-compose     = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit       = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
robolectric           = { module = "org.robolectric:robolectric",                       version.ref = "robolectric" }
androidx-compose-ui-test-junit4-unit = { module = "androidx.compose.ui:ui-test-junit4" }
junit         = { module = "junit:junit",                            version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit",              version.ref = "androidx-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core",  version.ref = "espresso-core" }


[plugins]
android-application   = { id = "com.android.application",                   version.ref = "android-gradle-plugin" }
android-library       = { id = "com.android.library",                       version.ref = "android-gradle-plugin" }
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform",        version.ref = "kotlin" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose",                     version.ref = "compose-multiplatform" }
roborazzi             = { id = "io.github.takahirom.roborazzi",                 version.ref = "roborazzi" }