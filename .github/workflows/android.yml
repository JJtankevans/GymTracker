# Compila o app, gera o APK de teste (debug) e roda os testes do módulo :shared.
# O APK fica para baixar na aba Actions > (execução) > Artifacts > "gymtracker-debug-apk".
# Chaves do Supabase: Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_URL  = https://<seu-projeto>.supabase.co
#   SUPABASE_KEY  = sb_publishable_...   (a chave PUBLICÁVEL; nunca a service_role)
# Sem esses secrets o app compila, mas o login avisa que as chaves não foram configuradas.
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # fixo no 24.04: o "ubuntu-latest" passou para o Ubuntu 26 em out/2026 e a instalação do Android SDK falhou nele
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # O runner já traz o Android SDK (ANDROID_HOME). Só aceita as licenças; o Gradle baixa o que faltar (plataforma 36 etc.).
      - name: Aceitar as licenças do Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > sdk-licenses.log 2>&1); then
            echo "::warning title=sdkmanager::$(tail -n 5 sdk-licenses.log | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Chaves do Supabase (local.properties, fora do git)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_KEY" > local.properties
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::SUPABASE_URL/SUPABASE_KEY não configurados: o APK abre, mas o login não vai funcionar."
          fi

      - name: Permissão do gradlew
        run: chmod +x ./gradlew

      - name: Gerar o APK debug
        run: |
          ./gradlew :app:assembleDebug --stacktrace > build-apk.log 2>&1 || {
            echo "::error title=Falha ao gerar o APK::$(grep -E '^e: |error:|FAILED|What went wrong' -A2 build-apk.log | grep -v '^> Task' | head -n 30 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # depois do APK: se algum teste falhar, o APK já está guardado e o relatório vira artefato
      - name: Testes do :shared
        run: |
          ./gradlew :shared:testDebugUnitTest --stacktrace > test-shared.log 2>&1 || {
            echo "::error title=Falha nos testes do shared::$(grep -E '^e: |FAILED|What went wrong|Exception|expected' test-shared.log | grep -v '^> Task' | head -n 30 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-shared
          path: shared/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
